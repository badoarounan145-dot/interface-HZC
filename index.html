<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HZC - 30 pays Afrique</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:20px;text-align:center}
.card{background:#1e293b;padding:25px;border-radius:15px;max-width:500px;margin:30px auto}
input,select,button,textarea{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;box-sizing:border-box}
button{background:#22c55e;color:white;font-weight:bold}
</style>
</head>
<body>
<h1>🌍 HZC PLATFORM</h1>
<p>Code 7777 = ILLIMITE pour Arouna</p>
<div class="card">
<input type="text" id="codeInput" placeholder="Ton code ici">
<select id="pays"><option>Côte d'Ivoire</option><option>Sénégal</option><option>Mali</option><option>Burkina</option><option>Guinée</option><option>Bénin</option><option>Togo</option><option>Niger</option><option>Cameroun</option><option>Gabon</option><option>Maroc</option><option>Algérie</option><option>Tunisie</option><option>Ghana</option><option>Nigeria</option><option>Kenya</option><option>Afrique du Sud</option><option>RDC</option><option>Congo</option><option>Rwanda</option><option>Angola</option><option>Egypte</option><option>Ethiopie</option><option>Tanzanie</option><option>Zambie</option><option>Mozambique</option><option>Madagascar</option><option>Liberia</option><option>Sierra Leone</option><option>Tchad</option></select>
<button onclick="valider()">Valider</button>
<p id="msg"></p>
</div>
<div class="card">
<textarea id="textInput" rows="3" placeholder="Ton texte..."></textarea>
<button onclick="optimiser()">Optimiser</button>
<p id="result"></p>
<p id="credits">Credits: -</p>
</div>
<script>
let credits=0,isUnlimited=false;
function valider(){
let c=document.getElementById('codeInput').value.trim();
if(c==="7777"){isUnlimited=true;credits=99999;msg.innerHTML="✅ PATRON 7777 - ILLIMITE";creditsEl();}else if(c.length>=4){isUnlimited=false;credits=1;msg.innerHTML="✅ Client - 1 credit";creditsEl();}else{msg.innerHTML="❌ Code invalide";}
}
function creditsEl(){document.getElementById('credits').innerText=isUnlimited?"Credits: ILLIMITE ♾️":"Credits: "+credits;}
function optimiser(){
if(credits<=0&&!isUnlimited){result.innerText="Plus de credit";return;}
let t=textInput.value;if(!t)return;
result.innerText="🚀 "+t.toUpperCase()+" ✨";if(!isUnlimited)credits--;creditsEl();
}
</script>
</body>
</html>
