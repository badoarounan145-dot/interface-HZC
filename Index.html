<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD TREICH</title><style>body{margin:0;font-family:system-ui;background:#f6f6f6}header{background:#000;color:#39FF14;padding:14px;text-align:center;font-weight:900;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:640px;margin:auto;padding:10px}.card{background:#fff;border-radius:16px;padding:12px;margin:10px 0}.btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:900;margin-top:8px}.y{background:#FFC300}.g{background:#25D366;color:#fff}.r{background:#ff4444;color:#fff}.d{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1);position:relative}.prod img{width:100%;height:210px;object-fit:cover}.info{padding:8px}.badge{position:absolute;bottom:78px;left:0;right:0;background:rgba(0,0,0,0.75);color:#39FF14;padding:4px 6px;font-size:10px;font-weight:800;text-align:center}#admin{display:none;border:2px solid #FFC300}input{width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}</style></head><body><header><span>BD TREICH</span><button onclick="askPin()" style="background:#222;color:#39FF14;border:1px solid #39FF14;padding:6px 10px;border-radius:8px;font-size:12px">⚙️ Vendeur</button></header><div class="wrap"><div id="admin" class="card"><h3 style="margin:0;text-align:center">GERER BOUTIQUE</h3><input id="shopName" placeholder="Nom boutique ex: BD TREICH"><input id="sellerName" placeholder="Ton prénom ex: Boris"><input id="city" placeholder="Ville ex: Abidjan - Treichville"><input id="wa" placeholder="WhatsApp"><input id="nom" placeholder="Nom produit"><input id="prix" type="number" placeholder="Prix"><label class="btn y" style="text-align:center;display:block">📷 PHOTO <input id="file" type="file" accept="image/*" hidden></label><img id="prev" style="display:none;width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:8px"><button class="btn g" onclick="addP()">+ AJOUTER</button><button class="btn d" onclick="hideAdmin()">🔒 CACHER</button></div><div class="grid" id="grid"></div></div><script>let PIN=localStorage.getItem('drip_pin')||'5455';let prods=JSON.parse(localStorage.getItem('drip21')||'[]');let waNum=localStorage.getItem('drip21_wa')||'0172463852';let shopName=localStorage.getItem('shopName')||'BD TREICH';let sellerName=localStorage.getItem('sellerName')||'Boris';let city=localStorage.getItem('city')||'Abidjan - Treichville';let pending='';document.getElementById('wa').value=waNum;document.getElementById('shopName').value=shopName;document.getElementById('sellerName').value=sellerName;document.getElementById('city').value=city;document.getElementById('shopName').oninput=e=>{shopName=e.target.value;localStorage.setItem('shopName',shopName);render();};document.getElementById('sellerName').oninput=e=>{sellerName=e.target.value;localStorage.setItem('sellerName',sellerName);render();};document.getElementById('city').oninput=e=>{city=e.target.value;localStorage.setItem('city',city);render();};document.getElementById('wa').oninput=e=>{waNum=e.target.value;localStorage.setItem('drip21_wa',waNum);};function askPin(){let p=prompt('Code:');if(p===PIN){document.getElementById('admin').style.display='block';render();}}window.hideAdmin=()=>{document.getElementById('admin').style.display='none';render();};document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),max=600,w=im.width,h=im.height;if(w>max||h>max){if(w>h){h*=max/w;w=max}else{w*=max/h;h=max}}c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,h-35,w,35);ctx.fillStyle='#39FF14';ctx.font='bold 14px system-ui';ctx.fillText(`${shopName} | ${sellerName} | ${city}`,10,h-12);pending=c.toDataURL('image/jpeg',0.6);document.getElementById('prev').src=pending;document.getElementById('prev').style.display='block';};im.src=r.result;};r.readAsDataURL(f);};function save(){localStorage.setItem('drip21',JSON.stringify(prods));render();}window.addP=()=>{let n=document.getElementById('nom').value.trim(),p=document.getElementById('prix').value.trim();if(!n||!p||!pending)return alert('Nom+Prix+Photo');prods.unshift({n,p:parseInt(p),i:pending,id:Date.now()});document.getElementById('nom').value='';document.getElementById('prix').value='';pending='';document.getElementById('prev').style.display='none';save();};window.delP=i=>{if(confirm('Supprimer?')){prods.splice(i,1);save();}};window.editP=i=>{let np=prompt('Nouveau prix',prods[i].p);if(np){prods[i].p=parseInt(np);save();}};window.order=i=>{let pr=prods[i];let num=waNum.replace(/\D/g,'');if(!num.startsWith('225'))num='225'+num;let msg=`Salut ${sellerName} (${shopName} ${city}), je veux ${pr.n} à ${pr.p}F`;window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`,'_blank');};function render(){let isAdmin=document.getElementById('admin').style.display==='block';document.getElementById('grid').innerHTML=prods.map((p,i)=>`<div class="prod"><img src="${p.i}"><div class="badge">${shopName} | ${city}</div><div class="info"><b>${p.n}</b><br><b style="color:green">${p.p}F</b><br><button class="btn g" onclick="order(${i})">Commander</button>${isAdmin?`<button class="btn r" onclick="delP(${i})">🗑️ SUPPRIMER</button>`:''}</div></div>`).join('')||'<div style="grid-column:1/3;text-align:center;padding:30px">Boutique vide</div>';}render();</script></body></html>
